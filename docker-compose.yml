services:
  identity-service:
    build:
      context: ./identity-service
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      MONGO_USERS_COLLECTION: ${MONGO_USERS_COLLECTION}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES}
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5

  catalog-service:
    build: ./catalog-service
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
  order-service:
    build: ./order-service
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
    ports:
      - "8003:8003"
    depends_on:
      mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_started

  compatibility-service:
    build: ./compatibility-service
    environment:
      SERVER_PORT: ${SERVER_PORT}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
    ports:
      - "8004:8004"
    depends_on:
      catalog-service:
        condition: service_started
  analytics-service:
    build: ./analytics-service
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_EVENTS_PREFIX: ${S3_EVENTS_PREFIX}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL}
    ports:
      - "8005:8005"
    depends_on:
      identity-service:
        condition: service_healthy

